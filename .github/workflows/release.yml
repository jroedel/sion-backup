name: Release

# Tag-triggered, because a release is a deliberate act and a push to main is
# not. `git tag v0.1.0 && git push --tags` is the whole interface.
on:
  push:
    tags: ['v*']

# Only this job may write, and only to releases. Everything else in this
# repository runs read-only.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # `make release` stamps the version from `git describe --tags`, and
          # actions/checkout fetches a shallow, tagless tree by default.
          # Without this every binary reports its version as a bare commit
          # hash — which is exactly the field the fleet dashboard uses to
          # answer "which machines are behind".
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The restic this release is tested against, verified against the pin.
      # Fetching it here means the real-restic tests actually run before a
      # release is cut, rather than skipping as they do on a bare runner.
      - name: Fetch the pinned restic
        run: |
          scripts/fetch-restic linux amd64 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Deliberately not `make check`: that target runs `go fmt`, which
      # rewrites files rather than complaining about them, so it would pass on
      # a tree CI should have rejected. Formatting is enforced on every push by
      # the ci workflow; what matters here is that the tag builds for every
      # target and its tests pass.
      - name: Verify before building
        run: |
          go vet ./...
          go test ./...
          make cross

      - name: Build every binary
        run: make release-all

      - name: Checksums
        run: make checksums

      # Shipped so an installer can verify restic without cloning the repo.
      - name: Include the restic pin
        run: cp deploy/restic.pin dist/

      - name: Write the release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## Installing

          Download the binary for the machine and **verify it before running
          it** — it is about to hold the credentials to somebody's off-site
          copy.

          ```sh
          sha256sum --ignore-missing -c SHA256SUMS
          ```

          restic needs no separate step: this binary installs the version it
          was tested against, verified against a hash compiled into it, into
          the data directory. `sion-backup restic` does it now; enrolling does
          it anyway. `restic.pin` ships alongside so the version and its
          upstream hashes can be checked by hand.

          Enrol the machine with a code from Eumaeus:

          ```sh
          sion-backup enroll --code XXXX-XXXX
          sion-backup doctor
          ```

          The machine keeps exactly one secret: a revocable token. The S3 keys
          and the repository password are fetched at the start of every backup
          and discarded when it ends.

          Service files for systemd, launchd and Windows are in `deploy/`.

          ---
          NOTES

      # A DRAFT, and this is the whole safety property.
      #
      # foundation/selfupdate reads /releases/latest, and GitHub excludes
      # drafts from it — the code checks rel.Draft again anyway. So between
      # this step and the last one the artifacts exist, are addressable, and
      # are invisible to every machine in the fleet. If the gate below fails,
      # this stays a draft forever and no client ever sees it.
      #
      # There is no earlier place to put the gate: the tag push is what
      # triggers this workflow, so "before tagging" is not a moment CI can
      # act on. Publication is the moment that matters, and this is it.
      - name: Publish as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Idempotent, because re-running this job is a normal event: the gate
          # below can fail for reasons that have nothing to do with the release
          # -- an expired API key, a cloud provider having a bad afternoon --
          # and the fix for those is to re-run, not to re-tag. A plain
          # `gh release create` fails on the second attempt and takes the whole
          # job with it before the gate ever gets another chance.
          #
          # A DRAFT CANNOT BE LOOKED UP BY TAG. GitHub does not attach the tag
          # to a release until it is published, so a draft for v0.3.0 lives at
          # /releases/tag/untagged-<hash> and `gh release view v0.3.0` reports
          # that it does not exist. Found by matching tag_name across the
          # listing instead, which is the only thing that works.
          #
          # Try-then-recover rather than check-then-create, so that whatever
          # the listing does or does not show, the outcome is the same: exactly
          # one draft carrying this tag name and these assets.
          assets="dist/sion-backup-* dist/SHA256SUMS dist/restic.pin"

          # shellcheck disable=SC2086  # a glob list, deliberately split
          if gh release create "$GITHUB_REF_NAME" \
               --draft \
               --title "$GITHUB_REF_NAME" \
               --generate-notes \
               --notes-file "$RUNNER_TEMP/notes.md" \
               $assets
          then
            exit 0
          fi

          echo "::notice::could not create the release; looking for an existing one."

          existing=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) \(.draft)\"" | head -1)

          if [ -z "$existing" ]; then
            echo "::error::$GITHUB_REF_NAME could not be created and does not exist."

            exit 1
          fi

          id=${existing%% *}
          draft=${existing##* }

          if [ "$draft" = false ]; then
            echo "::notice::$GITHUB_REF_NAME is already published; nothing to do."

            exit 0
          fi

          echo "::notice::refreshing the assets on the existing draft (id $id)."

          # By id, because by tag would not find it.
          # shellcheck disable=SC2086
          gh release upload "$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .tag_name)" \
            $assets --clobber || {
              echo "::error::could not refresh the draft's assets."

              exit 1
            }

      # Every way a release can be broken, against the binary that is about to
      # ship: a wrong hash, a truncated download, a rate-limited API, a build
      # for the wrong platform, an install directory this process may not
      # write. Containers, so it costs seconds.
      - name: Gate — does a broken release leave a machine alone?
        run: scripts/selfupdate-e2e/run

      # The one that would have caught a brick: the PREVIOUSLY PUBLISHED
      # release, installed on a machine that has never seen either binary by
      # the same install.sh a client ran, then upgraded to this candidate over
      # a real TLS connection, then restarted by a real systemd user manager.
      # If the service does not come back, this release does not ship.
      #
      # On a Vultr instance bought for this and destroyed after, when the key
      # is configured; in a privileged container on the runner when it is not.
      # Never skipped: an ungated release is the thing this is here to prevent.
      - name: Gate — does an upgraded machine come back?
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          # The gate is never skipped. The BACKEND degrades.
          #
          # A real instance is better evidence than a privileged container, but
          # an unusable API key is not evidence that the release is bad — and a
          # workflow that refuses to ship because of a billing lapse or a
          # changed IP allowlist has turned a safety measure into an outage.
          # So: ask whether Vultr is usable, say loudly when it is not, and
          # gate anyway on what is available.
          where="--docker"

          if [ -z "${VULTR_API_KEY:-}" ]; then
            echo "::warning::VULTR_API_KEY is not set; gating in a container instead."
          elif scripts/vultr-testbed check; then
            where=""
          else
            echo "::warning::Vultr is not usable from this runner; gating in a container."
            echo "::warning::Most likely the key's IP allowlist, which cannot include a"
            echo "::warning::hosted runner. See scripts/vultr-testbed check for the detail."
          fi

          if [ "$where" = "--docker" ]; then
            echo "::warning::A container runs privileged, so it proves less about a"
            echo "::warning::locked-down laptop. The upgrade itself is still real."
          fi

          scripts/selfupdate-gate $where \
            --candidate dist/sion-backup-linux-amd64 \
            --version "$GITHUB_REF_NAME"

      # Whatever the gate leaked. It destroys its own instance from a trap, so
      # this is for the run that was cancelled between buying one and getting
      # to the trap — which is the only way a box is ever left billing.
      - name: Destroy anything the gate left behind
        if: always()
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          [ -n "${VULTR_API_KEY:-}" ] || exit 0

          # If the key cannot even be used to look, say so rather than exiting
          # green: "nothing leaked" and "could not check" must not look the
          # same in a log somebody reads six months from now.
          if ! scripts/vultr-testbed check >/dev/null 2>&1; then
            echo "::warning::Could not reach Vultr to check for leaked instances."
            echo "::warning::If this run bought one, it is still running. Check the panel."
            exit 0
          fi

          scripts/vultr-testbed down || true
          scripts/vultr-testbed reap --older-than 0 || true

      # Only now can the fleet see it.
      #
      # By id for the same reason the draft step is: until this call succeeds
      # there is no tag attached to the release, so `gh release edit <tag>`
      # cannot find the thing it is meant to publish. Publishing is what
      # creates the association.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)

          if [ -z "$id" ]; then
            echo "::error::no release found for $GITHUB_REF_NAME to publish."

            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f tag_name="$GITHUB_REF_NAME" >/dev/null

          echo "::notice::published $GITHUB_REF_NAME; the fleet can now see it."
