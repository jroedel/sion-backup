name: Release

# Tag-triggered, because a release is a deliberate act and a push to main is
# not. `git tag v0.1.0 && git push --tags` is the whole interface.
on:
  push:
    tags: ['v*']

# Only this job may write, and only to releases. Everything else in this
# repository runs read-only.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # `make release` stamps the version from `git describe --tags`, and
          # actions/checkout fetches a shallow, tagless tree by default.
          # Without this every binary reports its version as a bare commit
          # hash — which is exactly the field the fleet dashboard uses to
          # answer "which machines are behind".
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The restic this release is tested against, verified against the pin.
      # Fetching it here means the real-restic tests actually run before a
      # release is cut, rather than skipping as they do on a bare runner.
      - name: Fetch the pinned restic
        run: |
          scripts/fetch-restic linux amd64 "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Deliberately not `make check`: that target runs `go fmt`, which
      # rewrites files rather than complaining about them, so it would pass on
      # a tree CI should have rejected. Formatting is enforced on every push by
      # the ci workflow; what matters here is that the tag builds for every
      # target and its tests pass.
      - name: Verify before building
        run: |
          go vet ./...
          go test ./...
          make cross

      - name: Build every binary
        run: make release-all

      # Before the checksums, so the installers are covered by them: they are
      # about to be run on somebody's laptop and they place a binary that holds
      # the credentials to an off-site copy.
      #
      # Flat, beside the binaries, rather than keeping deploy/'s shape. A
      # release is unpacked into one directory and that is where somebody runs
      # things from; the installers look in both places for exactly this
      # reason. Before this, the installers shipped nowhere at all and the
      # README told people to run one from the unpacked release, where it did
      # not exist -- and where, downloaded on its own, it would have found no
      # service file and silently skipped registering the service.
      - name: Include the installers and the service files
        run: |
          cp deploy/macos/install.sh          dist/install-macos.sh
          cp deploy/linux/install.sh          dist/install-linux.sh
          cp deploy/windows/install.ps1       dist/install-windows.ps1
          cp deploy/launchd/*.plist           dist/
          cp deploy/systemd/sion-backup.service dist/
          chmod +x dist/install-macos.sh dist/install-linux.sh

      # Shipped so an installer can verify restic without cloning the repo.
      - name: Include the restic pin
        run: cp deploy/restic.pin dist/

      - name: Checksums
        run: make checksums

      - name: Write the release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## Installing

          Download the binary for the machine and **verify it before running
          it** — it is about to hold the credentials to somebody's off-site
          copy.

          ```sh
          sha256sum --ignore-missing -c SHA256SUMS
          ```

          restic needs no separate step: this binary installs the version it
          was tested against, verified against a hash compiled into it, into
          the data directory. `sion-backup restic` does it now; enrolling does
          it anyway. `restic.pin` ships alongside so the version and its
          upstream hashes can be checked by hand.

          Enrol the machine with a code from Eumaeus:

          ```sh
          sion-backup enroll --code XXXX-XXXX
          sion-backup doctor
          ```

          The machine keeps exactly one secret: a revocable token. The S3 keys
          and the repository password are fetched at the start of every backup
          and discarded when it ends.

          Service files for systemd, launchd and Windows are in `deploy/`.

          ---
          NOTES

      # A DRAFT, and this is the whole safety property.
      #
      # foundation/selfupdate reads /releases/latest, and GitHub excludes
      # drafts from it — the code checks rel.Draft again anyway. So between
      # this step and the last one the artifacts exist, are addressable, and
      # are invisible to every machine in the fleet. If the gate below fails,
      # this stays a draft forever and no client ever sees it.
      #
      # There is no earlier place to put the gate: the tag push is what
      # triggers this workflow, so "before tagging" is not a moment CI can
      # act on. Publication is the moment that matters, and this is it.
      - name: Publish as a draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A DRAFT RELEASE HAS NO TAG. GitHub attaches the tag only when a
          # release is published, so a draft for v0.3.0 lives at
          # /releases/tag/untagged-<hash> and `gh release view v0.3.0` reports
          # that it does not exist. Everything below addresses releases by id
          # and matches on tag_name, because nothing else works.
          #
          # Find first, rather than create and recover. GitHub permits SEVERAL
          # drafts carrying the same tag_name, so a create-first approach makes
          # a second draft every time this job re-runs -- and re-running is the
          # normal response to a gate that failed for reasons outside the
          # release. The publish step would then have two to choose between,
          # and no way to tell which one the gate examined.
          find_release() {
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | \"\(.id) \(.draft)\""
          }

          while read -r id draft; do
            [ -n "$id" ] || continue

            if [ "$draft" = false ]; then
              echo "::error::$GITHUB_REF_NAME is already published. Refusing to"
              echo "::error::rebuild a release the fleet may already be running."

              exit 1
            fi

            # An unpublished leftover from a previous attempt. No machine has
            # ever been able to see it, so removing it costs nothing and having
            # exactly one draft is worth a great deal to the step that
            # publishes.
            echo "::notice::removing a stale draft for $GITHUB_REF_NAME (id $id)"
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done < <(find_release)

          # Everything in dist/, rather than a list of patterns kept in step
          # with what the build puts there. The list is how v0.6.3 shipped
          # without the installers: they were copied into dist/, covered by
          # SHA256SUMS, and then not uploaded, because nothing matched
          # `dist/sion-backup-*` and nobody thought to extend the line. The
          # build decides what a release contains; this step's job is to
          # attach it.
          #
          # SHA256SUMS covers every other file here, and `make checksums`
          # excludes only itself, so "upload all of dist" and "the checksums
          # describe the release" cannot drift apart.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/*

          echo "::notice::drafted $GITHUB_REF_NAME; invisible to the fleet until the gate passes."

      # A release that is missing something nobody notices is the failure this
      # step exists for, and it has already happened once: v0.6.3 shipped
      # without the installers the README tells people to run, because the
      # upload line listed patterns and the build had grown a file none of them
      # matched. Nothing failed. The release looked complete.
      #
      # Comparing the draft's assets against dist/ cannot drift the way a list
      # does: whatever the build produced is what must be attached, and a file
      # added to the build is covered the day it appears.
      #
      # It runs while the release is still a DRAFT, so a failure here leaves it
      # invisible to the fleet, exactly like a failed self-update gate.
      - name: Every file the build produced is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                 --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft) | .id" | head -1)

          if [ -z "$id" ]; then
            echo "::error::no draft release found for $GITHUB_REF_NAME"
            exit 1
          fi

          gh api "repos/$GITHUB_REPOSITORY/releases/$id/assets" --paginate \
            --jq '.[].name' | sort > "$RUNNER_TEMP/attached.txt"

          ls -1 dist/ | sort > "$RUNNER_TEMP/built.txt"

          if ! diff -u "$RUNNER_TEMP/built.txt" "$RUNNER_TEMP/attached.txt"; then
            echo "::error::the release does not carry what the build produced (- built, + attached)"
            exit 1
          fi

          echo "::notice::all $(wc -l < "$RUNNER_TEMP/built.txt") files attached"

      # Every way a release can be broken, against the binary that is about to
      # ship: a wrong hash, a truncated download, a rate-limited API, a build
      # for the wrong platform, an install directory this process may not
      # write. Containers, so it costs seconds.
      - name: Gate — does a broken release leave a machine alone?
        run: scripts/selfupdate-e2e/run

      # The one that would have caught a brick: the PREVIOUSLY PUBLISHED
      # release, installed on a machine that has never seen either binary by
      # the same install.sh a client ran, then upgraded to this candidate over
      # a real TLS connection, then restarted by a real systemd user manager.
      # If the service does not come back, this release does not ship.
      #
      # On a Vultr instance bought for this and destroyed after, when the key
      # is configured; in a privileged container on the runner when it is not.
      # Never skipped: an ungated release is the thing this is here to prevent.
      - name: Gate — does an upgraded machine come back?
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          # The gate is never skipped. The BACKEND degrades.
          #
          # A real instance is better evidence than a privileged container, but
          # an unusable API key is not evidence that the release is bad — and a
          # workflow that refuses to ship because of a billing lapse or a
          # changed IP allowlist has turned a safety measure into an outage.
          # So: ask whether Vultr is usable, say loudly when it is not, and
          # gate anyway on what is available.
          where="--docker"

          if [ -z "${VULTR_API_KEY:-}" ]; then
            echo "::warning::VULTR_API_KEY is not set; gating in a container instead."
          elif scripts/vultr-testbed check; then
            where=""
          else
            echo "::warning::Vultr is not usable from this runner; gating in a container."
            echo "::warning::Most likely the key's IP allowlist, which cannot include a"
            echo "::warning::hosted runner. See scripts/vultr-testbed check for the detail."
          fi

          if [ "$where" = "--docker" ]; then
            echo "::warning::A container runs privileged, so it proves less about a"
            echo "::warning::locked-down laptop. The upgrade itself is still real."
          fi

          scripts/selfupdate-gate $where \
            --candidate dist/sion-backup-linux-amd64 \
            --version "$GITHUB_REF_NAME"

      # The third gate: does a machine running this build still back up, and
      # can what it wrote be read back?
      #
      # BLOCKS on a failed restore or a failed integrity check, and only WARNS
      # when the bucket could not be reached. The line is one question -- did
      # this tell us anything about the release? A restore that comes back
      # wrong did. Wasabi having a bad afternoon did not, and failing a release
      # over somebody else's outage turns a safety measure into the thing that
      # stops work, which is what an IP allowlist did to v0.3.0.
      #
      # scripts/backup-e2e/run distinguishes them: exit 1 is the build, exit 2
      # is the weather. It refuses to report exit 2 when it could not run the
      # probe at all, so a gate that never gates is not a state this can reach
      # quietly.
      - name: Gate — does it still back up, and can it be restored?
        env:
          WASABI_ACCESS_KEY_ID: ${{ secrets.WASABI_ACCESS_KEY_ID }}
          WASABI_SECRET_ACCESS_KEY: ${{ secrets.WASABI_SECRET_ACCESS_KEY }}
          WASABI_BUCKET: ${{ vars.WASABI_BUCKET }}
          WASABI_REGION: ${{ vars.WASABI_REGION }}
        run: |
          if [ -z "${WASABI_ACCESS_KEY_ID:-}" ] || [ -z "${WASABI_BUCKET:-}" ]; then
            echo "::warning::Wasabi is not configured; this release ships without"
            echo "::warning::anyone having checked that it can still take a backup."

            exit 0
          fi

          set +e
          scripts/backup-e2e/run --shapes 2
          status=$?
          set -e

          case "$status" in
            0)
              echo "::notice::backed up, restored and verified on two machines."
              ;;
            2)
              echo "::warning::The bucket could not be reached, so nothing was"
              echo "::warning::learned about this build. Publishing anyway."
              ;;
            *)
              echo "::error::A machine running this build could not back up or"
              echo "::error::could not restore what it wrote. Not publishing."

              exit 1
              ;;
          esac

      # Whatever the gate leaked. It destroys its own instance from a trap, so
      # this is for the run that was cancelled between buying one and getting
      # to the trap — which is the only way a box is ever left billing.
      - name: Destroy anything the gate left behind
        if: always()
        env:
          VULTR_API_KEY: ${{ secrets.VULTR_API_KEY }}
        run: |
          [ -n "${VULTR_API_KEY:-}" ] || exit 0

          # If the key cannot even be used to look, say so rather than exiting
          # green: "nothing leaked" and "could not check" must not look the
          # same in a log somebody reads six months from now.
          if ! scripts/vultr-testbed check >/dev/null 2>&1; then
            echo "::warning::Could not reach Vultr to check for leaked instances."
            echo "::warning::If this run bought one, it is still running. Check the panel."
            exit 0
          fi

          scripts/vultr-testbed down || true
          scripts/vultr-testbed reap --older-than 0 || true

      # Only now can the fleet see it.
      #
      # By id for the same reason the draft step is: until this call succeeds
      # there is no tag attached to the release, so `gh release edit <tag>`
      # cannot find the thing it is meant to publish. Publishing is what
      # creates the association.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)

          if [ -z "$id" ]; then
            echo "::error::no release found for $GITHUB_REF_NAME to publish."

            exit 1
          fi

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F draft=false -f tag_name="$GITHUB_REF_NAME" >/dev/null

          echo "::notice::published $GITHUB_REF_NAME; the fleet can now see it."
