name: CI

on:
  push:
    branches: [main]
  pull_request:

# The default token can read this repository and nothing else. CI here builds
# and tests; it does not publish, so it needs nothing more.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Three runners, because this program's whole job is to work on three
    # platforms and the parts most likely to break — the keyring, the paths,
    # the Windows path mapping — are exactly the parts a Linux-only CI would
    # never execute.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read from go.mod, so the version CI uses and the version the
          # module declares cannot drift apart.
          go-version-file: go.mod
          cache: true

      # Validates deploy/restic.pin on every push, and lets the real-restic
      # tests run instead of skipping. A stale or wrong pin is then caught the
      # day it is introduced rather than the day somebody installs from it.
      #
      # Unix only: the fetch script is /bin/sh, and the tests it unlocks skip
      # on Windows anyway.
      - name: Fetch the pinned restic
        if: runner.os != 'Windows'
        run: |
          scripts/fetch-restic "" "" "$RUNNER_TEMP/bin"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  cross:
    # A separate job rather than a step in the matrix: it is fast, it needs
    # one runner, and its failure means something different — a build tag
    # broke a platform, not a test.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Type-check every platform
        run: make cross

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  installers:
    # install.ps1 needs Windows even to be parsed, and it does things to a
    # machine that a test cannot undo. So at least parse it.
    #
    # A 300-line PowerShell script with a typo on line 200 fails halfway
    # through installing on somebody's laptop, in the evening, in front of
    # them. That is the failure this job exists to prevent. The shell
    # installers get the same treatment and more in shell-installers below.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Parse the PowerShell installer
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "deploy/windows/install.ps1", [ref]$null, [ref]$errors) | Out-Null

          if ($errors) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            exit 1
          }

          Write-Host "install.ps1 parses"

  installer-windows:
    # Parsing install.ps1 proves it has no typos. Running it proves it
    # installs, and those are not the same claim: a script can parse
    # perfectly and put the binary somewhere the machine can never update
    # from, which is what it did until the day before the first Windows
    # machine was enrolled.
    #
    # A hosted windows-latest runner is a real Windows machine, it is free on
    # a public repository, and nothing here needs a bucket or a server. It
    # cannot prove a backup runs -- that is the Windows gate that does not
    # exist yet -- but it proves the install lands where it is supposed to.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build the Windows binary
        run: go build -o dist/sion-backup-windows-amd64.exe ./cmd/sion-backup

      - name: Install it the way a person would
        shell: pwsh
        run: |
          ./deploy/windows/install.ps1 -Binary dist/sion-backup-windows-amd64.exe -Yes
          $global:LASTEXITCODE = 0

      - name: It landed in the profile, and can replace itself there
        shell: pwsh
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'sion-backup\sion-backup.exe'

          if (-not (Test-Path $exe)) {
            throw "no binary at $exe"
          }

          # doctor exits non-zero on a machine that is not enrolled, which
          # this one is not. The exit status is not the assertion; the line
          # about self-update is, because a binary somewhere it cannot
          # rewrite is a machine that takes one version and keeps it.
          $report = & $exe doctor 2>&1 | Out-String

          Write-Host $report

          if ($report -notmatch 'replaceable by this process') {
            throw "this install cannot update itself"
          }

          $global:LASTEXITCODE = 0

      - name: The task runs that binary, as this account
        shell: pwsh
        run: |
          $task = Get-ScheduledTask -TaskName 'sion-backup' -ErrorAction Stop
          $execute = $task.Actions[0].Execute
          $want = Join-Path $env:LOCALAPPDATA 'sion-backup\sion-backup.exe'

          if ($execute -ne $want) {
            throw "the task runs $execute, not $want"
          }

          Write-Host "task runs $execute as $($task.Principal.UserId)"

      - name: Leave the runner as it was found
        if: always()
        shell: pwsh
        run: |
          Unregister-ScheduledTask -TaskName 'sion-backup' -Confirm:$false -ErrorAction SilentlyContinue
          $global:LASTEXITCODE = 0

  shell-installers:
    # The other half of the same job, on a runner with a real bash, real
    # `install`, and a real /tmp — because one of these checks runs the Linux
    # installer rather than only reading it.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Parse both shell installers
        run: |
          for script in deploy/linux/install.sh deploy/macos/install.sh; do
            bash -n "$script" && echo "$script parses"
          done

      # v0.6.4 shipped installers that told the truth about everything except
      # where they had looked. Both said "looked beside this script" and
      # neither did: every candidate was relative to the current directory.
      # Running the installer from the directory it was downloaded into hides
      # it, which is why it survived every test and was found on a Debian box
      # by typing ~/Downloads/install-linux.sh from the home directory.
      - name: The installers can find what ships with them
        run: scripts/installer-lookups

  selfupdate:
    # Self-update is the one feature that can break every machine at once, and
    # the only one whose failure mode is "the fleet stops being reachable by
    # the thing that would fix it". So its end-to-end behaviour is checked on
    # every push, not only before a release.
    #
    # The binary here is the release binary, unmodified. What is faked is the
    # internet: a container answers as api.github.com, under a certificate the
    # test machine's trust store accepts, and offers a release that is broken
    # in one specific way per case. Nothing in the program knows.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Every way a release can be wrong
        run: scripts/selfupdate-e2e/run
