# sion-backup — the file an installer drops on a machine.
#
# Copy it to the machine's data directory (run "sion-backup paths" to see
# where), edit it, then run "sion-backup enroll".
#
# ---------------------------------------------------------------------------
# TWO KINDS OF SETTING, AND THEY BEHAVE DIFFERENTLY
# ---------------------------------------------------------------------------
#
# THE PLAN -- node_id, repository, targets, excludes, schedule and
# tuning -- is read ONCE, on a machine that has no plan yet, and lives in the
# database from then on. Editing this file afterwards changes nothing. That is
# deliberate: the person using the machine edits their own excludes on the
# status page, and a re-read at every reboot would silently undo them.
#
# A plan seeded from this file is a SUGGESTION, not a decision. Nothing is
# backed up until somebody at the machine has confirmed it at
# http://127.0.0.1:7391/setup, which is the page enrolment opens. What this
# file buys is that the boxes on that page are already filled in with an
# administrator's answer -- not that the question is skipped.
#
# THE DEPLOYMENT SETTINGS -- [eumaeus]
# Where this machine gets its credentials, and where it reports.
#
# NOT optional any more. Nothing is cached on this computer: the S3 keys and
# the repository password are fetched from Eumaeus at the start of every backup
# and discarded when it ends. A machine that cannot reach Eumaeus cannot back
# up -- which is a fair trade, because a machine that cannot reach Eumaeus
# almost certainly cannot reach the bucket either.
#
# It defaults to https://terraboskamp.org -- the installation this fleet
# reports to -- so on an ordinary machine this line can be deleted. Set it only
# to point somewhere else.
url = "https://terraboskamp.org"

# There is no token here. Enrollment is a login:
#
#   1. Sign in to Eumaeus, choose "Enrol a computer", pick the owner and the
#      bucket. It shows a code, good for fifteen minutes, usable once.
#   2. On the machine:  sion-backup enroll --code K4TP-9QX2
#
# That writes a machine token -- the only secret this program keeps on disk --
# to the data directory, and prints the owner's restore card. Revoking that
# token in Eumaeus cuts the machine off immediately.

# Is this machine on a connection somebody pays for by the byte?
#
# Unset means ask the operating system, which only Linux can answer -- on
# Windows and macOS the answer is always "cannot tell", so this is where a
# person writes down what the machine cannot find out. See
# foundation/netcost.
#
# It gates ONE thing: the weekly check that reads part of the repository back
# to prove it is still there and still decrypts. Backups run whatever this
# says. A backup that did not happen is the failure this program exists to
# prevent, and no connection is expensive enough to be worth choosing that
# one instead.
#
# Set it true on a machine that lives on a mobile hotspot.
# metered = false

[server] -- are read on EVERY start.
# They are facts about how the machine was installed and are yours to change.
#
# ---------------------------------------------------------------------------

# What this machine is called on the fleet dashboard.
#
# Chosen by you, not derived from the hostname: "DESKTOP-4KJ2P1" tells nobody
# whose laptop stopped backing up. Keep it stable -- it is the key the
# dashboard and the credential escrow both use.
node_id = "office-laptop-1"

# The restic repository, in restic's own URL syntax.
#
# One bucket per machine. Not one bucket for the fleet: restic deduplicates
# within a repository and not across them, so a shared bucket would save space
# -- and it would also mean every machine's credentials open every machine's
# backups, and one compromised laptop is the whole fleet.
#
# Wasabi's endpoints are listed at
# https://docs.wasabi.com/docs/what-are-the-service-urls-for-wasabis-different-regions
repository = "s3:https://s3.us-central-1.wasabisys.com/example-node-bucket"

# What to back up. Everything inside these, minus the excludes below.
#
# Windows: back up the user's profile rather than all of C:. The rest of C: is
# an operating system that a reinstall replaces faster than a restore does,
# and it is most of the bytes.
targets = [
  "/home/user",
  # "C:\\Users\\Example",
  # "/Users/example",
]

# What to leave out, in restic's exclude syntax.
#
# Caches and package directories are the ones that matter: they are large,
# they change completely between runs so deduplication does not help, and
# nobody has ever needed one back.
excludes = [
  # Everywhere
  "**/node_modules",
  "**/.cache",
  "**/Cache",
  "**/CacheStorage",
  "*.iso",
  "*.vmdk",

  # Windows
  # "C:\\Users\\*\\AppData\\Local\\Temp",
  # "C:\\Users\\*\\AppData\\Local\\Packages",
  # "C:\\Users\\*\\AppData\\Local\\Google\\Chrome",
  # "C:\\Users\\*\\OneDrive",          # already in the cloud

  # macOS
  # "/Users/*/Library/Caches",
  # "/Users/*/Library/Containers/com.apple.mail/Data/Library/Caches",

  # Linux
  # "/home/*/.cache",
  # "/home/*/snap/*/common/.cache",
]

[schedule]
# Local times of day, as HH:MM.
#
# The set-up page offers four shapes -- hourly, three times a day, once a day,
# or your own list -- and writes the times, the jitter and the floor together.
# Writing them here by hand is the fourth of those. Mind the floor below: a
# list of twenty-four times under a six-hour minimum interval runs four times a
# day and looks like a bug.
#
#
# 13:00 rather than an overnight slot, because a work computer is switched on,
# awake and on a network in the middle of the working day -- which is exactly
# when an overnight schedule fails. If the machine is asleep at this time it
# backs up as soon as it is next on; see business/domain/plan.
times = ["13:00"]

# Spread the fleet out so thirty machines do not hit the bucket in one minute.
# The offset is derived from node_id and the date, so it survives a reboot.
jitter_minutes = 30

# The floor between two runs, whatever the times say.
min_interval = "6h"

# There is no [storage] section, and that is not an omission.
#
# This fleet does not prune. A single restic prune on a real repository over a
# gigabit uplink took more than 24 hours -- prune downloads every pack it wants
# to consolidate, extracts the live blobs and re-uploads them, so it moves a
# large fraction of the repository in both directions.
#
# Space is reclaimed by rotating the bucket instead: a fresh repository roughly
# once a year, the old bucket deleted whole. The history a machine has is
# therefore the age of its current repository, which the status page shows.
#
# The security property this buys is worth more than the space: no key in the
# system can delete backup data. The machine's S3 key may delete only under
# locks/, and no prune key exists. See docs/model.md.

[tuning]
# restic's target pack size. 16 is its default and suits most connections;
# 32 does fewer round trips on 300Mbit or better.
pack_size_mib = 16

# How many files restic reads at once. 2 suits an older hard disk, 6 an NVMe.
# Higher finishes sooner and makes the machine feel slower while it runs.
read_concurrency = 4

# Back up from a filesystem snapshot (VSS on Windows) so open files -- Outlook
# data files, above all -- are included. Requires administrator rights.
# Unset means "on for Windows, off elsewhere", which is almost always right.
# use_fs_snapshot = true

# If VSS is refused, back up the live tree anyway and mark the run degraded.
# The alternative is a non-administrator machine taking no backups at all.
allow_vss_fallback = true

# Do not follow mounts: network shares, external drives, and on Linux the
# pseudo-filesystems the old scripts had to exclude by hand.
one_file_system = true

# Skip files at or above this many gigabytes. Unset or 0 means no limit.
#
# The one exclusion that cannot be written as a pattern, and often the one that
# matters most: a single virtual machine image or disk dump in a home directory
# can double a first backup, and it is rebuildable from somewhere else anyway.
# Reaches restic as --exclude-larger-than.
# skip_larger_than_gb = 2

# Do not start SCHEDULED runs on a connection somebody is paying for by the
# byte. "Back up now" and "sion-backup run" are unaffected: both are a person
# deciding.
#
# Off by default, and that default is an argument rather than an oversight -- a
# backup that did not happen is the failure this program exists to prevent. What
# makes it worth offering is the alternative somebody reaches for when their
# laptop starts a 40 GB first run on a phone tether, which is to pause backups
# entirely and forget.
#
# It needs `metered` above, or a Linux machine: on Windows and macOS this
# program cannot yet tell, and an unknown connection is not read as metered.
# Note the pair: `metered` is a FACT about the connection this machine is on,
# and this is a POLICY about what to do when it is metered. Neither implies the
# other.
# skip_on_metered = false

[eumaeus]
# Where the credential escrow and the fleet dashboard live.
#
# Optional, and defaults to https://terraboskamp.org: every machine running
# this program reports to the same installation, so the only reason to set it
# is a staging server or a test against localhost. The API version is not part
# of it -- the client appends /api/backup/v1 itself.
#
# This machine cannot back up without reaching whatever this points at. Nothing
# is cached: the S3 keys and the repository password are fetched at the start
# of every run and discarded at the end.
# url = "https://terraboskamp.org"

# A Eumaeus token, minted read-write and scoped to the backup vault alone:
#
#   eumaeus token mint -label sion-backup-office-laptop-1 -vaults backup -write -days 3650
#
# It must NOT be able to read the finance vault. A token on a work computer is
# a token that can be taken off a work computer.
#
# "sion-backup enroll" caches this in the platform keyring and tells you to
# remove the line; "sion-backup doctor" complains until you do. Prefer
# token_file, or the SION_BACKUP_EUMAEUS_TOKEN environment variable, over
# putting the secret in a file that also gets copied around as a template.
# token = "..."
# token_file = "/etc/sion-backup/eumaeus.token"

[update]
# This program replaces itself with the newest release, after a backup and
# never during one. It verifies the download against the SHA256SUMS the
# release publishes and runs the new binary once, asking it its version,
# before anything is moved. The previous binary is kept beside it until the
# next start.
#
# Leave it on. The fleet is laptops in several buildings with no management
# agent, and a version that has to be installed by hand is a version half of
# them will never get.
#
# A build whose version is not a release tag -- a developer's working copy,
# which reports "dev" -- is never replaced, whatever this says.
#
# A new version starts on probation. If it will not stay running, the previous
# one is put back automatically and this machine will not install that version
# again -- see "sion-backup doctor" for whether that has happened, and
# "sion-backup update --forget" to try it anyway. Switching this off does not
# switch that off: a machine that has already taken a bad version still comes
# back.
# enabled = true

# Where releases come from. Only for testing against a fork.
# repository = "jroedel/sion-backup"

[server]
# The status page. Loopback only -- it has no login, and the daemon refuses to
# bind anything else. Reach it from elsewhere over SSH, not by changing this.
addr = "127.0.0.1:7391"

# The restic binary, by absolute path. LEAVE THIS UNSET on an ordinary machine.
#
# By default this program installs and upgrades its own restic -- one pinned
# version across the whole fleet, downloaded from restic's own release,
# verified against a hash compiled into the binary, and kept in the data
# directory where no administrator is needed to replace it. Nothing on PATH is
# used: a machine with a three-year-old snap-installed restic is a machine
# whose exit codes mean something different from everybody else's.
#
# Setting this overrides all of that. The binary here is used exactly as
# given, its version is never checked or upgraded, and keeping it current
# becomes yours -- which is the right trade for a platform the pin has no
# build for, and the wrong one everywhere else. "sion-backup recon" and
# "sion-backup doctor" both say plainly when a machine is in this state.
# restic = "/opt/sion-backup/restic"
