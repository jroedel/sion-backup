# OpenAPI description of the Eumaeus backup API.
#
# The prose specification is eumaeus-api.md and it is the authority on
# behaviour — idempotency, audit rules, what the client does with each status.
# This file is the shape of the wire, kept alongside it so a client stub or a
# request validator can be generated rather than hand-written.
#
# Keep the two in step. Where they disagree, the markdown is right.
openapi: 3.1.0

info:
  title: Eumaeus backup API
  version: 1.0.0
  summary: Enrollment, credentials and run reporting for the sion-backup fleet.
  description: |
    Six endpoints, spoken by `sion-backup` on each work computer.

    The shape follows one rule: **the server owns the facts, the machine
    reports what it did.** Eumaeus provisions the bucket, generates the
    repository password, mints the S3 keys and decides when a machine is
    overdue. The machine caches nothing: it fetches its credentials at the
    start of every run and discards them at the end.

    See `model.md` for the domain model and `eumaeus-api.md` for the rules a
    correct implementation has to follow.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://eumaeus.example.org/api/backup/v1
    description: Replace with the installation's own host.

security:
  - machineToken: []

tags:
  - name: enrollment
    description: Turning a one-time code into a machine.
  - name: machine
    description: What a machine may read about itself.
  - name: runs
    description: Reporting backups.

paths:
  /enrollments/claim:
    post:
      tags: [enrollment]
      operationId: claimEnrollment
      summary: Exchange a one-time code for a machine token and credentials
      description: |
        The only unauthenticated endpoint. An admin creates the code in the
        Eumaeus web UI — choosing the owner, the node ID and the bucket — and
        carries it to the machine.

        **Single-use and atomic.** Mark the code consumed in the same
        transaction that creates the machine and mints the token, so two
        concurrent claims produce one machine. A repeated claim returns 409 and
        never a fresh token: a retry after a dropped response is
        indistinguishable from a replayed code, and issuing a new code is cheap
        because the admin is standing at the machine.

        **Rate limiting is required.** Eight base32 characters is 40 bits.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaimRequest'
      responses:
        '200':
          description: |
            Claimed. The `machine_token` is shown once and is not recoverable;
            the server stores only a hash of it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaimResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The code has already been claimed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: |
            The code is valid but no repository has been provisioned for the
            machine it names. Provisioning must complete before enrollment.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          $ref: '#/components/responses/RateLimited'

  /machines/me:
    get:
      tags: [machine]
      operationId: getMachine
      summary: The machine's own state, with no secrets in it
      description: |
        Polled hourly and at startup. **This is also the heartbeat** — it is
        what populates `last_seen_ip` and what proves a paused machine is still
        alive.

        Because it carries no secrets it may be logged in full, unlike
        `/machines/me/credentials`.

        Rotation is driven entirely by `credentials_version`: the client
        compares it against what it cached and fetches the credentials
        endpoint when it differs.
      parameters:
        - name: If-None-Match
          in: header
          required: false
          schema: { type: string }
          description: |
            An hourly poll from thirty machines, of a resource that changes
            twice a year, should mostly be 304s.
      responses:
        '200':
          description: Current state.
          headers:
            ETag:
              schema: { type: string }
              description: Changes whenever any field in the body does.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineState'
        '304':
          description: Unchanged since the supplied ETag.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Unauthorised'

  /machines/me/credentials:
    get:
      tags: [machine]
      operationId: getCredentials
      summary: The repository password and both S3 key pairs
      description: |
        Called at the start of **every** backup: the client stores nothing, so
        this is where each run gets its repository password and S3 keys.

        Separate from `/machines/me` precisely so that the frequent, secret-free
        call can be logged in full while this one is audited instead.

        **Audit every call** — machine, time, source address,
        `credentials_version` — and never the values. A legitimate machine calls
        about once a day, so a burst, or a call from an unexpected address, is
        the one signal that would reveal a stolen machine token.

        **Never log the body**, here or in any proxy in front of it.

        The repository URL is repeated in the response deliberately: which
        repository the credentials open must be part of the same atomic answer,
        or a client polling across a rotation could pair the new password with
        the old bucket.
      responses:
        '200':
          description: |
            The credentials for the repository this machine should be using
            now. During a cutover that is the new one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CredentialsResponse'
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Unauthorised'
        '500':
          description: |
            Returned rather than a partial answer when the stored record has no
            `restic_password`. A client that believed it was enrolled against a
            repository it cannot open would discover it as an unverified backup
            at 1am.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /runs:
    post:
      tags: [runs]
      operationId: reportRun
      summary: Report that a backup started or finished
      description: |
        The machine is identified by its token, not by a field in the body — a
        client has no way to name another machine.

        **Idempotent on `(machine, run_uuid, phase)`.** The client marks a run
        reported only after the POST succeeds, so an acknowledgement lost in
        transit produces a duplicate; accept it and return 200.

        **Never reject an event for being old.** A laptop that backed up on a
        plane reports when the lid opens in the office.

        **A `snapshot_id` you have no record of creating is an alarm.** Since
        nothing in this system can delete backup data, adding junk is the only
        thing a compromised machine key can do, so this is the detection that
        matters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunEvent'
      responses:
        '200':
          description: Recorded, including a duplicate of one already held.
        '204':
          description: Recorded, no body.
        '400':
          description: |
            Malformed. The client marks the run reported and logs loudly rather
            than retrying: a request the server calls malformed will not become
            well-formed by being resent.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Unauthorised'

  /machines/me/rotation-request:
    post:
      tags: [machine]
      operationId: requestRotation
      summary: The owner asks for a fresh bucket
      description: |
        Raised from the machine's own status page, after the owner has seen
        what a fresh start would reclaim and what it would discard.

        **A work item, not a command.** Eumaeus queues it for an administrator,
        who provisions the new bucket. Nothing on the machine can create a
        bucket, and nothing should: provisioning starts a bill and begins a
        cutover in which two buckets exist and one is eventually deleted. A
        person belongs in that loop, and the loop runs about once a year per
        machine.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RotationRequest'
      responses:
        '202':
          description: Queued for an administrator.
        '403':
          description: |
            `fresh_bucket_available` is false for this machine.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: |
            A request is already open, or a rotation is already in progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          $ref: '#/components/responses/Unauthorised'

  /machines/me/card-issued:
    post:
      tags: [machine]
      operationId: recordCardIssued
      summary: Record that the owner's restore card was printed
      description: |
        Drives the `owner_card` state on the dashboard.

        This records that the card was *rendered*, which is not the same as it
        being printed, handed over and filed. Keep a separate manual
        confirmation for "the card is in the safe" — that is the one that
        matters and only a person can assert it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardIssued'
      responses:
        '204':
          description: Recorded.
        '401':
          $ref: '#/components/responses/Unauthorised'
        '403':
          $ref: '#/components/responses/Unauthorised'

components:
  securitySchemes:
    machineToken:
      type: http
      scheme: bearer
      description: |
        Issued by `POST /enrollments/claim` and bound to one machine. It can
        read that machine's state and credentials, post that machine's run
        events, and record that machine's card was printed. Nothing else.

        Revocation must be immediate; the client treats 401 and 403 as terminal
        and reports the machine as de-enrolled rather than retrying.

        Revocation is sufficient on its own: the machine caches no credentials,
        so a revoked token means the next backup cannot obtain a password. The
        one thing it does not undo is the owner's printed restore card, which
        carries read-only credentials by design.

  responses:
    NotFound:
      description: No such thing. An ordinary answer, not a failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorised:
      description: |
        The token was refused — wrong, revoked or expired. Terminal for the
        client, which stops trying.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: |
        Too many attempts. The client cannot distinguish this from any other
        failure and will retry later, ignoring `Retry-After`.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: |
            One sentence for a human. It reaches a log file on a work computer
            and the output of `sion-backup doctor`, so it must be useful and
            must contain nothing sensitive.
          examples: ['that enrollment code has expired']
        field:
          type: string
          description: The offending request field, where there is one.
          examples: ['code']
      examples:
        - error: that enrollment code has expired
          field: code

    Timestamp:
      type: string
      format: date-time
      description: |
        RFC 3339 with an offset, local to the machine rather than UTC — a fleet
        in two time zones reports in each one's own. Store what you are given
        and convert for display.

        Every timestamp in a request is client-supplied and untrusted. Record a
        server-side `received_at` alongside and use that for alerting; a
        machine with a wrong clock must not be able to look healthy.
      examples: ['2026-09-09T13:04:22.117+02:00']

    Owner:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          description: Shown on the dashboard. "Whose laptop stopped" is the question.
        email:
          type: string
          format: email
          description: Where staleness warnings and the RECOVERED email go.

    KeyPair:
      type: object
      required: [access_key_id, secret_access_key]
      properties:
        access_key_id: { type: string }
        secret_access_key: { type: string }

    Credentials:
      type: object
      required: [restic_password, machine, restore]
      description: |
        Two key pairs, not one, and the split is the security model.

        `machine` writes and may delete only under `locks/` — restic writes and
        removes a lock file on every run, so that carve-out is required, but it
        means a ransomwared laptop can add to the repository and never destroy
        it.

        `restore` is read-only and is what gets printed on the owner's card, so
        that a lost page exposes their own data but cannot destroy it.

        There is no third, delete-capable key, because nothing prunes.
      properties:
        restic_password:
          type: string
          minLength: 1
          description: |
            The one irreplaceable secret. restic derives the repository's master
            key from it and there is no recovery path. Generated by Eumaeus when
            the bucket is provisioned. Must never be empty in a 200.
        machine: { $ref: '#/components/schemas/KeyPair' }
        restore: { $ref: '#/components/schemas/KeyPair' }

    Repository:
      type: object
      required: [url, provider, region, bucket, created_at]
      properties:
        url:
          type: string
          description: |
            The repository location in restic's own syntax. **Hand this to the
            client verbatim and never rewrite it** — the client keys its local
            plan and its keyring entries on the exact string, and a server that
            reassembled it from the parts below would eventually reassemble it
            differently and the machine would look unenrolled.
          examples: ['s3:https://s3.us-central-1.wasabisys.com/example-node-bucket']
        provider: { type: string, examples: ['wasabi'] }
        region: { type: string, examples: ['us-central-1'] }
        bucket: { type: string, examples: ['example-node-bucket'] }
        created_at:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: |
            The history horizon. Nothing prunes, so a machine's history is the
            age of its current repository — roughly a rotation cycle. The client
            shows "backups available since …" from this rather than implying a
            retention policy nothing enforces.

    RepositoryState:
      type: object
      required: [url, state, created_at]
      properties:
        url: { type: string }
        state:
          type: string
          enum: [active, cutting-over, retired]
          description: |
            During a cutover the URL is already the **new** repository; the old
            one is kept only until the new one has proven itself.
        created_at: { $ref: '#/components/schemas/Timestamp' }

    ClaimRequest:
      type: object
      required: [code, hostname, os, local_account, agent]
      properties:
        code:
          type: string
          pattern: '^[0-9A-Za-z]{4}-?[0-9A-Za-z]{4}$'
          description: |
            Eight characters of Crockford base32 with an optional hyphen for
            legibility. Compare case-insensitively and ignore the hyphen.
          examples: ['K4TP-9QX2']
        hostname:
          type: string
          description: The machine's own name. May differ from `node_id`, and may change.
          examples: ['DESKTOP-4KJ2P1']
        os:
          type: string
          description: '`GOOS/GOARCH`.'
          examples: ['windows/amd64']
        local_account:
          type: string
          description: |
            The OS account the daemon runs as. Not trivia: DPAPI and Keychain
            bind the cached credentials to it, so a machine whose account
            changes can no longer read its own credentials, and the dashboard
            needs to be able to show why.
          examples: ['CORP\jdoe']
        agent:
          type: string
          examples: ['v1.2.0']
      examples:
        - code: K4TP-9QX2
          hostname: DESKTOP-4KJ2P1
          os: windows/amd64
          local_account: 'CORP\jdoe'
          agent: v1.2.0

    ClaimResponse:
      type: object
      required:
        [machine_token, node_id, owner, warn_after_hours, repository,
         credentials_version, credentials]
      properties:
        machine_token:
          type: string
          description: |
            Shown once and never again; the server stores only a hash. A token
            the server can redisplay is a token a copy of the database yields.
        node_id:
          type: string
          description: |
            Stable, human-chosen at enrollment. `office-laptop-1`, not
            `DESKTOP-4KJ2P1` — a hostname tells nobody whose laptop stopped.
          examples: ['office-laptop-1']
        owner: { $ref: '#/components/schemas/Owner' }
        warn_after_hours:
          type: integer
          minimum: 1
          default: 240
          description: |
            How long without a *verified* backup before the owner is emailed.
            Ten days by default: these are laptops belonging to people who
            travel, and an alarm on day two would be wrong four times a month.
            Always-on machines should be set much lower.
        repository: { $ref: '#/components/schemas/Repository' }
        credentials_version:
          type: integer
          minimum: 1
        credentials: { $ref: '#/components/schemas/Credentials' }
      examples:
        - machine_token: mt_7f3c9a1e4b6d
          node_id: office-laptop-1
          owner: { name: 'Fr. N', email: n@example.org }
          warn_after_hours: 240
          repository:
            url: 's3:https://s3.us-central-1.wasabisys.com/example-node-bucket'
            provider: wasabi
            region: us-central-1
            bucket: example-node-bucket
            created_at: '2026-09-09T10:04:00+02:00'
          credentials_version: 1
          credentials:
            restic_password: kQ8vN2mPq7xR
            machine: { access_key_id: AKIAEXAMPLEMACHINE, secret_access_key: 'redacted' }
            restore: { access_key_id: AKIAEXAMPLERESTORE, secret_access_key: 'redacted' }

    MachineState:
      type: object
      required:
        [node_id, owner, state, warn_after_hours, repository,
         credentials_version, card, server_time]
      properties:
        node_id: { type: string }
        owner: { $ref: '#/components/schemas/Owner' }
        state:
          type: string
          enum: [active, retired]
          description: A retired machine's client should stop backing up and say so.
        paused_until:
          oneOf:
            - { $ref: '#/components/schemas/Timestamp' }
            - { type: 'null' }
          description: |
            Pausing suppresses alerts, and it expires — a pause with no expiry
            is how a machine stops backing up permanently, quietly, with a note
            explaining that it was intentional once.
        warn_after_hours: { type: integer, minimum: 1 }
        repository: { $ref: '#/components/schemas/RepositoryState' }
        credentials_version:
          type: integer
          minimum: 1
          description: |
            Increments whenever any credential changes, including an S3 key
            rotation that leaves the password untouched.

            Informational, now that the client caches nothing and refetches at
            the start of every run: it is what the audit log records and what a
            support call can compare against.
        card:
          type: object
          required: [state]
          properties:
            state:
              type: string
              enum: [never, issued, superseded]
              description: |
                `superseded` means the bucket rotated and the new card has not
                been issued. A machine backing up perfectly whose password
                exists in exactly one database is one server failure from having
                no backups at all.
            issued_at:
              oneOf:
                - { $ref: '#/components/schemas/Timestamp' }
                - { type: 'null' }
        fresh_bucket_available:
          type: boolean
          description: |
            Whether the organisation is willing to provision a new bucket for
            this machine.

            **A permission, not a recommendation.** The server cannot tell
            whether rotating is worth it — the figures come from `restic stats`
            against the repository, and only the machine holds credentials to
            read it. The client combines this flag with its own weekly
            measurement and raises the subject only when the repository is over
            90 days old, at least 30% of it is superseded data, and at least
            5 GiB would be reclaimed.

            Rotation is then always the owner's idea. An organisation that
            imposes it finds machines switched off on rotation day.
        storage_price_per_tib_month:
          type: number
          minimum: 0
          description: |
            What storage costs, so the machine can turn reclaimable bytes into
            money on its own status page. Omitted or `0` means the page talks
            in gigabytes only — a wrong figure is worse than none, because it
            is the sort of thing that gets quoted in a meeting.
        server_time:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: |
            So the client can detect its own clock being wrong, which would
            otherwise corrupt snapshot timestamps and the alerting silently.
      examples:
        - node_id: office-laptop-1
          owner: { name: 'Fr. N', email: n@example.org }
          state: active
          paused_until: null
          warn_after_hours: 240
          repository:
            url: 's3:https://s3.us-central-1.wasabisys.com/example-node-bucket'
            state: active
            created_at: '2026-03-14T09:00:00+01:00'
          credentials_version: 3
          card: { state: issued, issued_at: '2026-03-14T09:12:00+01:00' }
          fresh_bucket_available: true
          storage_price_per_tib_month: 6.99
          server_time: '2026-09-09T21:40:11+02:00' 

    CredentialsResponse:
      type: object
      required: [credentials_version, repository, credentials]
      properties:
        credentials_version: { type: integer, minimum: 1 }
        repository:
          type: object
          required: [url]
          properties:
            url: { type: string }
        credentials: { $ref: '#/components/schemas/Credentials' }

    RunEvent:
      type: object
      required: [run_uuid, phase, started_at, seeding, repository_url, verified, agent, os]
      properties:
        run_uuid:
          type: string
          format: uuid
          description: |
            UUIDv7, generated by the client before the run begins, identical on
            both phases. Version 7 so it sorts by time and the dashboard can
            order a machine's runs without trusting its clock.

            It replaces a per-machine autoincrement, which was zero on every
            start event and repeated from one after a machine was reimaged.
          examples: ['0192f3a1-7c4e-7b21-9f10-3c2d5e8a41b7']
        phase:
          type: string
          enum: [started, finished]
          description: |
            A `started` with no `finished` is a finding, not a data error — it
            is a machine that died mid-backup, which is exactly what the start
            event exists to make visible.
        started_at: { $ref: '#/components/schemas/Timestamp' }
        finished_at:
          allOf: [{ $ref: '#/components/schemas/Timestamp' }]
          description: Present on `finished` only.
        outcome:
          type: string
          minLength: 1
          # Deliberately NOT an enum, though the values below are the only ones a
          # current client sends. The prose specification requires an
          # unrecognised outcome to be recorded and shown red rather than
          # rejected, so a future client adding a sixth value cannot blank a
          # fleet's dashboard — and a request validator generated from an enum
          # here would do precisely the opposite. Constrain it in the UI, not on
          # the way in.
          examples: [success, degraded, incomplete, unverified, failed]
          description: |
            Present on `finished` only.

            `success` — complete snapshot, verified by restoring a file from it.
            `degraded` — verified, taken without a filesystem snapshot; open
            files may be missing.
            `incomplete` — a real, restorable snapshot with named files missing.
            `unverified` — restic wrote a snapshot and nothing came back out.
            `failed` — no snapshot.

            `degraded` and `incomplete` reset the staleness clock: a restorable
            snapshot exists, and treating them otherwise would put a permanent
            alarm on every Windows machine whose user is not an administrator.

            `unverified` does not reset it and should email the admin at once —
            it is louder than `failed`, because a failure is visible and
            somebody will fix it, while `unverified` means the machine believes
            it is protected and may not be.

            **Treat an unrecognised value as red rather than rejecting the
            event**, so a future client adding a sixth cannot blank a dashboard.
        message:
          type: string
          description: |
            One sentence for a human. Never contains a credential: restic
            errors carry the command line, and no secret is ever in one.
        snapshot_id:
          type: string
          description: |
            restic's short ID. **Present on `incomplete` too** — that outcome
            means a real snapshot with holes, not the absence of one.
        files_processed: { type: integer, minimum: 0 }
        bytes_processed:
          type: integer
          minimum: 0
          description: Total seen, not uploaded.
        data_added:
          type: integer
          minimum: 0
          description: Actually uploaded, after deduplication.
        unreadable_files:
          type: integer
          minimum: 0
          description: |
            **A count, not a list, on purpose.** The paths are on the machine's
            own status page in full. Sending them would put somebody's filenames
            in a server log the client does not control, and a path like
            `\Clients\Diocese of X\settlement.docx` discloses more than the
            count ever would.
        seeding:
          type: boolean
          description: |
            The first backup into a newly provisioned repository: it uploads
            everything, takes hours or days, and is the run the cutover guard
            waits on before the old bucket may be retired.

            **This is not "full vs incremental", because restic has no such
            distinction.** Every `restic backup` is the same operation — walk
            the source, chunk it, upload only blobs the repository does not
            already hold. There is no `--full` flag, and `--force` forces
            re-*reading* the source rather than re-uploading it, so the chunks
            still deduplicate and nothing is freed. A "full" backup into an
            existing repository uploads almost nothing.

            Do not treat a long-running `started` on a seeding run as a
            failure. Show it as progress.
        repository_url:
          type: string
          description: |
            Which bucket this run actually wrote to. The server already knows
            which one it told the machine to use; this lets it confirm the
            machine went there, which matters during a cutover when two buckets
            exist.
        verified:
          type: boolean
          description: |
            A file written moments before the run came back out of the
            repository byte for byte. This — not "restic exited zero" — is what
            the staleness clock runs on.
        agent: { type: string }
        os: { type: string }
      examples:
