    RotationRequest:
      type: object
      required: [repository_url, reclaimable_bytes, fresh_bytes, measured_at]
      description: |
        The figures travel with the request so an administrator sees what the
        owner was shown, and so a request made against numbers that have since
        changed can be recognised as stale. The server need not trust them — it
        can measure again — but it should record them.
      properties:
        repository_url:
          type: string
          description: The repository the owner is asking to replace.
        reclaimable_bytes:
          type: integer
          minimum: 0
          description: |
            What a fresh repository would not need to hold. This is also
            exactly the history rotating discards, and the status page says so
            in the same sentence.
        fresh_bytes:
          type: integer
          minimum: 0
          description: What the seeding run would have to upload.
        measured_at: { $ref: '#/components/schemas/Timestamp' }
      examples:
        - repository_url: 's3:https://s3.us-central-1.wasabisys.com/example-node-bucket'
          reclaimable_bytes: 204010946560
          fresh_bytes: 161061273600
          measured_at: '2026-09-09T13:20:00+02:00'

    CardIssued:
      type: object
      required: [repository_url, printed_at]
      properties:
        repository_url:
          type: string
          description: |
            So that a card printed for a superseded bucket cannot mark the
            current one as covered.
        printed_at: { $ref: '#/components/schemas/Timestamp' }
      examples:
        - repository_url: 's3:https://s3.us-central-1.wasabisys.com/example-node-bucket'
          printed_at: '2026-09-09T13:22:00+02:00' 
